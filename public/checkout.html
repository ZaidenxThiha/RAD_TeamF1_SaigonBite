<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order food · SaigonBite</title>
  <link rel="stylesheet" href="/checkout.css">
  <script type="module" src="/checkout.js"></script>
</head>
<body>
  <header><div class="site"><strong>Saigon<span>Bite</span></strong></div></header>
  <main class="site">
    <h1>Place an order</h1>
    <p id="status" role="status"></p>
    <form id="checkout" hidden>
      <div class="layout">
        <div class="column">
          <fieldset id="order-fields" class="panel">
            <legend>Menu and delivery</legend>
            <div class="pair">
              <label>Demo customer <select name="username"><option value="customer">Local customer</option><option value="tourist">Tourist</option></select></label>
              <label>Kitchen hub <select name="hubId" required></select></label>
            </div>
            <label>Brand <select name="brandId" required></select></label>
            <div id="menu"></div>
            <label>Delivery area <select name="areaId" required></select></label>
            <label>Delivery address <input name="address" maxlength="250" placeholder="Street address" required></label>
          </fieldset>
        </div>
        <div class="column">
          <section class="panel">
            <h2>Order summary</h2>
            <label>Voucher code <input name="voucherCode" maxlength="80" placeholder="Optional"></label>
            <dl id="quote" aria-live="polite" hidden></dl>
            <p id="quote-error" class="notice error" role="alert" hidden></p>
            <div id="alternatives" class="actions"></div>
            <div class="actions">
              <button id="review" type="button" class="primary">Review total</button>
              <button id="cancel" type="button" hidden>Cancel checkout</button>
            </div>
          </section>
          <fieldset id="payment" class="panel" hidden>
            <legend>Payment</legend>
            <label>Payment method <select name="method"><option value="cod">Cash on delivery</option><option value="online">Online payment</option></select></label>
            <label id="simulation" hidden>Simulated authorization <select name="simulation"><option value="approve">Approve</option><option value="decline">Decline</option></select></label>
            <p id="payment-error" class="notice error" role="alert" hidden></p>
            <div class="actions">
              <button id="place" class="primary" type="submit">Place order</button>
            </div>
          </fieldset>
        </div>
      </div>
    </form>
    <section id="receipt" class="panel" hidden aria-live="polite">
      <h2>Order receipt</h2>
      <dl></dl>
      <button class="primary" type="button" id="restart">Start another order</button>
    </section>
  </main>
</body>
</html>
